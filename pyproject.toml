# Ultralytics 🚀 AGPL-3.0 License - https://ultralytics.com/license

# Overview:
# This pyproject.toml file manages the packaging metadata and tool configuration for Ultralytics YOLOv3.
# Most users run YOLOv3 directly from a repository clone with dependencies from requirements.txt.

# Key Sections:
# - [build-system]: Specifies the build requirements and backend (e.g., setuptools, wheel).
# - [project]: Includes details like name, version, description, authors, dependencies and more.
# - [project.optional-dependencies]: Provides additional, optional packages for extended features.
# - [tool.*]: Configures settings for various tools (pytest, ruff, etc.) used in the project.

# Documentation:
# For comprehensive documentation and usage instructions, visit: https://docs.ultralytics.com/models/yolov3

[build-system]
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# Project settings -----------------------------------------------------------------------------------------------------
[project]
name = "YOLOv3"
description = "Ultralytics YOLOv3 for object detection."
readme = "README.md"
requires-python = ">=3.8"
license = { "text" = "AGPL-3.0" }
keywords = ["machine-learning", "deep-learning", "computer-vision", "ML", "DL", "AI", "YOLO", "YOLOv3", "Ultralytics"]
authors = [
    { name = "Glenn Jocher" },
    { name = "Ayush Chaurasia" },
    { name = "Jing Qiu" }
]
maintainers = [
    { name = "Glenn Jocher" },
    { name = "Ayush Chaurasia" },
    { name = "Jing Qiu" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

# Required dependencies ------------------------------------------------------------------------------------------------
dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.23.5",
    "opencv-python>=4.6.0",
    "pillow>=10.3.0",
    "pyyaml>=5.3.1",
    "requests>=2.32.2",
    "scipy>=1.4.1",
    "setuptools>=70.0.0",
    "torch>=1.8.0",
    "torchvision>=0.9.0",
    "psutil>=5.9.0", # system utilization
    "ultralytics-thop>=2.1.2", # FLOPs computation https://github.com/ultralytics/thop
    "pandas>=1.1.4",
    "packaging>=20.0", # general utilities
    "seaborn>=0.11.0", # plotting
    "ultralytics>=8.4.110",
]

# Optional dependencies ------------------------------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "ipython",
    "pytest",
    "pytest-cov",
    "coverage[toml]",
]
export = [
    "onnx>=1.12.0", # ONNX export
    "coremltools>=7.0; platform_system != 'Windows'", # CoreML only supported on macOS and Linux
    "openvino-dev>=2023.0", # OpenVINO export
]
# scikit-learn==0.19.2  # CoreML quantization
# nvidia-pyindex  # TensorRT export
# nvidia-tensorrt  # TensorRT export
logging = [
    "comet_ml", # https://docs.ultralytics.com/integrations/comet
    "tensorboard>=2.13.0",
    "dvclive>=2.12.0",
]
extra = [
    "ipython", # interactive notebook
    "albumentations>=1.0.3", # training augmentations
    "pycocotools>=2.0.11", # COCO mAP
]

[project.urls]
"Bug Reports" = "https://github.com/ultralytics/yolov3/issues"
"Funding" = "https://ultralytics.com"
"Source" = "https://github.com/ultralytics/yolov3/"

# Tools settings -------------------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"benchmarks.py" = ["E402"]
"detect.py" = ["E402"]
"export.py" = ["E402"]
"models/yolo.py" = ["E402"]
"train.py" = ["E402"]
"utils/loggers/comet/__init__.py" = ["E402"]
"utils/loggers/comet/hpo.py" = ["E402"]
"val.py" = ["E402"]

[tool.docformatter]
wrap-summaries = 120
wrap-descriptions = 120
in-place = true
pre-summary-newline = true
close-quotes-on-newline = true

[tool.codespell]
ignore-words-list = "nd,writeable"
skip = '*venv*'
